<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HK Livery Editor</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="editor" class="editor hidden">
        <!-- Paint surface — full screen, transparent, captures mouse -->
        <div id="paint-surface" class="paint-surface"></div>

        <!-- Brush cursor indicator -->
        <div id="brush-cursor" class="brush-cursor"></div>

        <!-- Floating toolbar -->
        <div id="toolbar" class="toolbar">
            <div class="toolbar-handle" id="toolbar-handle">
                <span class="toolbar-title">LIVERY</span>
            </div>

            <!-- Tools row -->
            <div class="tool-row">
                <button class="tool-btn active" data-tool="pen" title="Pen (B)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
                </button>
                <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l9-9 8 8-4 5z"/><path d="M6.5 13.5l5 5"/></svg>
                </button>
            </div>

            <!-- Color -->
            <div class="tool-section">
                <div class="color-row">
                    <input type="color" id="color-input" value="#ffffff" />
                    <input type="text" id="color-hex" class="color-hex" value="#ffffff" maxlength="7" spellcheck="false" />
                </div>
                <div class="color-presets" id="color-presets"></div>
            </div>

            <!-- Size -->
            <div class="tool-section">
                <label class="tool-label">SIZE</label>
                <input type="range" id="brush-size" min="1" max="80" value="8" />
            </div>

            <!-- Actions -->
            <div class="action-row">
                <button id="btn-undo" class="action-btn" title="Undo (Ctrl+Z)" disabled>↩</button>
                <button id="btn-redo" class="action-btn" title="Redo (Ctrl+Y)" disabled>↪</button>
                <button id="btn-clear" class="action-btn" title="Clear">🗑</button>
            </div>

            <div class="save-row">
                <button id="btn-save" class="btn btn-primary">SAVE</button>
                <button id="btn-close" class="btn btn-ghost">✕</button>
            </div>
        </div>

        <!-- Hidden canvas for texture accumulation -->
        <canvas id="tex-canvas" width="1024" height="1024" style="display:none;"></canvas>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
