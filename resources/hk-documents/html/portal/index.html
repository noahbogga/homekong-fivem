<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMEKONG · 文件圖片上載</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body>
    <div class="card">
        <div class="brand">HOMEKONG</div>
        <h1 id="pp-title">文件圖片上載</h1>
        <p class="sub" id="pp-sub">輸入遊戲內顯示的代碼，然後選擇或貼上圖片。</p>

        <label class="lbl" id="pp-code-label">上載代碼</label>
        <input id="code" class="code-input" maxlength="6" placeholder="ABC123" autocomplete="off">

        <div id="drop" class="drop">
            <div class="drop-inner">
                <div class="drop-icon">📷</div>
                <div id="pp-drop-text">按此選擇 · 拖放 · 或 <b>貼上 (Ctrl+V)</b></div>
                <input id="file" type="file" accept="image/*" hidden>
            </div>
        </div>

        <img id="preview" class="preview hidden">

        <button id="send" class="btn" disabled>上載</button>
        <div id="status" class="status"></div>
    </div>
    <script src="portal.js"></script>
</body>
</html>
