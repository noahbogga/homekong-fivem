================================================================================
FEATURE LIST — ACHIEVABLE SYSTEMS (ready to build)
================================================================================

Each feature lists the natives/fields it uses and difficulty (1-5 stars).

─── ENGINE & POWER ─────────────────────────────────────────────────────────────

[A1] TURBO / SUPERCHARGER BOOST <IN PLAN FOR FUTURE DEVELOPMENT>
    How: SetVehicleEngineTorqueMultiplier per-frame, scaled by RPM
    Extra: fDriveInertia modulation for spool-up feel
    Visual: SetVehicleBoostActive for backfire/flames
    Difficulty: ★★☆☆☆

[A2] ANTI-LAG / BACKFIRE (NOT REQUUIRED: HANDLED BY JIM-MECHANIC/lambra-tunerChipV2 )
    How: On throttle lift, hold RPM via SetVehicleCurrentRpm
    Extra: Play exhaust pop sounds, particle effects
    Realism: Timed — only active for X seconds after lift
    Difficulty: ★★☆☆☆

[A3] LAUNCH CONTROL [MUST HAVE]
    How: SetVehicleCurrentRpm to hold at target (e.g. 0.75)
         SetVehicleBurnout(true) for smoke
         On release: SetVehicleEngineTorqueMultiplier spike
    Extra: RPM bounce at limiter, visual rev counter
    Difficulty: ★★★☆☆

[A4] REV LIMITER (CURRENTLY HANDELED BY THE LEGACY GEARBOX; WOULD WANT A REPLACEMENT; MUST WORK WITH JIM-MECHANIC manual gearbox upgrade.)
    How: Detect GetVehicleCurrentRpm > threshold
         SetVehicleEngineTorqueMultiplier(veh, 0.0) to cut power
         Alternate frames for bounce effect
    Difficulty: ★☆☆☆☆

[A5] NOS / NITROUS (NOT REQUUIRED: HANDLED BY JIM-MECHANIC)
    How: Timed boost via SetVehicleEngineTorqueMultiplier (2-3x)
         + ModifyVehicleTopSpeed for speed cap raise
    Visual: SetVehicleBoostActive, screen effects, sound
    Balance: Limited charges, cooldown, per-vehicle capacity
    Difficulty: ★★☆☆☆

[A6] POWER MODES (Eco / Sport / Race)   <IN PLAN FOR FUTURE DEVELOPMENT>
    How: Swap fInitialDriveForce between preset values
         + adjust fDriveInertia for throttle response
         + adjust fSteeringLock for steering weight
    UI: Keybind cycle or menu selection
    Difficulty: ★★☆☆☆

[A7] TORQUE CURVE SIMULATION [semi-must? have to check if it does anything + conflicts with other scripts]
    How: SetVehicleEngineTorqueMultiplier scaled by current RPM
         Low RPM = less torque, peak at mid, falloff at top
    Effect: Feels like a real engine with a powerband
    Difficulty: ★★★☆☆

─── TRANSMISSION ───────────────────────────────────────────────────────────────

[B1] SHIFT FEEL (DCT vs MANUAL) (CURRENTLY HANDELED BY THE LEGACY GEARBOX (it has global gearbox settings to do this); WOULD WANT A REPLACEMENT; MUST WORK WITH JIM-MECHANIC manual gearbox upgrade.)
    How: Modify fClutchChangeRateScaleUpShift/DownShift
         DCT = very high (instant shifts)
         Manual = lower (momentary power cut during shift)
    Extra: Detect gear change, apply brief torque cut
    Difficulty: ★★☆☆☆

[B2] SEQUENTIAL SHIFT SIMULATION (CURRENTLY HANDELED BY THE LEGACY GEARBOX; function doesnt exist, just pure manual gearbox.))
    How: On gear change detected, SetVehicleEngineTorqueMultiplier(0.3)
         for 2-3 frames (simulates power cut during shift)
    Extra: Rev blip sound on downshift
    Difficulty: ★★☆☆☆

[B3] GEAR-DEPENDENT BEHAVIOR (not sure: check if the legacy gearbox actually does this *migh aswell check B1 and B2 and A4)
    How: Read GetVehicleCurrentGear, apply different torque mult per gear
         1st gear = most torque, higher gears = less
    Effect: Realistic acceleration curve without touching handling
    Difficulty: ★★☆☆☆

─── SUSPENSION & BODY ──────────────────────────────────────────────────────────

[C1] ACTIVE SUSPENSION / RIDE HEIGHT MODES <IN PLAN FOR FUTURE DEVELOPMENT; is it purely visual? THIS SHOULD BE INTERGRATED ON THE hk-racecam SCRIPT INSTEAD>
    How: Modify fSuspensionRaise, fSuspensionForce, fSuspensionCompDamp
         Presets: Comfort (soft, raised), Sport (firm, mid), Track (stiff, low)
    Extra: Speed-adaptive (auto-lower at high speed)
    Difficulty: ★★☆☆☆

[C2] LAUNCH SQUAT (rear compression on acceleration) [MUST HAVE; if its purely VISUALs, THIS SHOULD BE INTERGRATED ON THE hk-racecam SCRIPT INSTEAD]
    How: Detect high throttle + acceleration
         Temporarily lower fSuspensionRaise on rear (via bias)
         Increase fSuspensionCompDamp briefly
    Visual: Car visually squats on hard launch
    Difficulty: ★★★☆☆

[C3] BRAKE DIVE CONTROL [semi-must have?; depends on development]; THIS SHOULD BE INTERGRATED ON THE hk-racecam SCRIPT INSTEAD]
    How: Detect braking (GetVehicleThrottleOffset or brake control)
         Increase fSuspensionCompDamp, increase fSuspensionForce
    Effect: Less nose-dive under braking = sportier feel
    Difficulty: ★★☆☆☆

[C4] AIR SUSPENSION SIMULATION [;THIS SHOULD BE INTERGRATED ON THE hk-racecam SCRIPT INSTEAD]
    How: fSuspensionRaise modulated by keybind or speed
         Parked: low (slammed look)
         Driving: raised (clearance)
         High speed: lowered (downforce feel)
    Difficulty: ★★☆☆☆

─── TRACTION & GRIP ────────────────────────────────────────────────────────────

[D1] TRACTION CONTROL (TC) [MUST HAVE]
    How: Compare GetVehicleWheelSpeed across wheels
         If rear >> front (wheelspin): reduce torque multiplier
    Modes: Off / Low / High intervention
    Difficulty: ★★★☆☆

[D2] ABS SIMULATION [MUST HAVE]
    How: Detect wheels locking (wheel speed = 0 while car moving)
         Pulse fBrakeForce between full and reduced
    Effect: Prevents lockup, shorter braking distance
    Difficulty: ★★★☆☆

[D3] DRIFT MODE / EASY DRIFT [MUST HAVE; toggle ofc]
    How: Reduce fHandBrakeForce (softer handbrake initiation)
         Reduce fTractionCurveLateral (less snap)
         Reduce fAntiRollBarForce (allow more roll)
         Optionally: SetVehicleReduceGrip during handbrake
    Effect: Car slides predictably, holds drift angle longer
    Difficulty: ★★☆☆☆

[D4] TIRE WEAR SIMULATION {NO NEED FOR THIS; no tyres can brake on my fivem server setting}
    How: Track total wheel rotation over time
         Gradually reduce fTractionCurveMax as "wear" accumulates
         Reset on pit stop / repair
    Effect: Grip degrades over a race, strategy element
    Difficulty: ★★★☆☆

[D5] DYNAMIC AWD SIMULATION [MUST HAVE EVEN IF WE HAD TO FAKE, via traction bias + torque modulation]
    How: Detect rear wheelspin (GetVehicleWheelSpeed)
         When spinning: increase fTractionBiasFront (send more to front)
         When gripping: restore to RWD-biased split
    Note: fDriveBiasFront doesn't truly work, but fTractionBiasFront does
    Difficulty: ★★★☆☆


─── STABILITY & HANDLING ───────────────────────────────────────────────────────

[E1] STABILITY CONTROL (ESC) [if works, MUST HAVE' margenlly changes how highspeed works]
    How: Monitor GetEntityRotationVelocity (yaw rate)
         If yaw rate exceeds threshold: reduce torque + increase ARB
         Effectively limits oversteer at speed
    Difficulty: ★★★☆☆

[E2] SPEED-SENSITIVE STEERING <in plan? need to see how it works in game.
    How: Reduce fSteeringLock as speed increases
         Low speed: full lock (easy parking)
         High speed: reduced lock (stable highway driving)
    Difficulty: ★★☆☆☆

[E3] HANDLING PROFILES (per-vehicle presets) [WE WONT LET USER SELECT; but having a selection means if we were to override handling on some vehicles then we could.]
    How: Config file with preset values per vehicle model
         Player selects "Stock / Sport / Track / Drift"
         Swaps ~10 handling values simultaneously
    Difficulty: ★★☆☆☆

─── WHEELIE / HEADLIFT (replacing CF_CAN_WHEELIE) ─────────────────────────────

[F1] CONTROLLED WHEELIE SYSTEM [MUST HAVE; crutial for muscle cars, literally the reason got me started hk-racecam]
    How: ApplyForceToEntity with upward Z-force at front axle offset
         Trigger: high throttle + handbrake + low speed + RWD vehicle
         Control: force amount = configurable, ramps up/down smoothly
         Safety: auto-disengage above X speed or if pitch > Y degrees
    Effect: Front lifts smoothly (no snap), holds, sets down gently
    Prerequisite: REMOVE strAdvancedFlags 402 from handling.meta first
    Works on: ANY vehicle (not class-locked like vanilla)
    Difficulty: ★★★★☆

[F2] DRAG LAUNCH HEADLIFT [also a MUST HAVE; on cars other than muscle cars eg dodge viper can do this; depends on how it looks.]
    How: Same as F1 but tied to launch control system [A3]
         Only activates during a proper drag launch sequence
         Auto-releases when car reaches X speed
    Visual: Dramatic but controlled front lift on launch
    Difficulty: ★★★★☆

─── DOWNFORCE & AERODYNAMICS ───────────────────────────────────────────────────

[G1] SPEED-DEPENDENT DOWNFORCE [ must have - better downforce!]
    How: SetVehicleGravityAmount scaled by speed
         60 km/h = 1.0 (normal), 200 km/h = 1.15 (pressed down)
    Alt: ApplyForceToEntity with downward Z-force scaled by speed^2
    Effect: Car feels planted at high speed, light at low speed
    Difficulty: ★★☆☆☆

[G2] ACTIVE AERO (DRS / DRAG REDUCTION) [must have; it would be a shame to have a drag reduction system and not use it]
    How: When conditions met (straight, high speed, no braking):
         Reduce fInitialDragCoeff = less air resistance = more top speed
         When braking: increase = more drag = shorter braking
    Difficulty: ★★☆☆☆

─── DAMAGE & WEAR ──────────────────────────────────────────────────────────────

[H1] ENGINE DAMAGE → POWER LOSS {NOT NEEDED}
    How: Read GetVehicleEngineHealth
         Scale SetVehicleEngineTorqueMultiplier by health %
         Dead engine at 0 health
    Difficulty: ★☆☆☆☆

[H2] WHEEL DAMAGE → GRIP LOSS {NOT NEEDED}
    How: Read GetVehicleWheelHealth per wheel
         Scale fTractionCurveMax by worst wheel health
    Difficulty: ★★☆☆☆

[H3] BRAKE FADE {NOT NEEDED}
    How: Track total braking time/intensity
         Gradually reduce fBrakeForce during sustained heavy braking
         Recover when brakes cool (not braking for X seconds)
    Difficulty: ★★★☆☆

================================================================================
5. FEATURE LIST — NOT ACHIEVABLE (or requires workaround)
================================================================================

[X1] DISABLE CF_CAN_WHEELIE AT RUNTIME  {dont need, we gonna custom make by lifting vehicle's Z'}
    Status: IMPOSSIBLE via script
    Why: strAdvancedFlags lives in CCarHandlingData, not accessible
    Workaround: Restream handling.meta with strAdvancedFlags set to 0
    Then use custom wheelie system [F1] to replace it

[X2] TRUE AWD/RWD/FWD SWITCH AT RUNTIME {sad}
    Status: BROKEN (fDriveBiasFront changes value but not wheel behavior)
    Workaround: Fake it with fTractionBiasFront + torque modulation
    Or: restream different handling.meta per mode (heavy approach)

[X3] PER-WHEEL TORQUE DISTRIBUTION [try to impliment with your workaround]
    Status: NOT EXPOSED by any native
    Workaround: Brake individual wheels to simulate limited-slip diff
    (apply brake to spinning wheel = torque transfers to gripping wheel)

[X4] REAR-WHEEL STEERING {not needed}
    Status: NOT EXPOSED (no per-wheel steer angle control)
    Workaround: None. Only global fSteeringLock available.

[X5] TRUE TIRE PHYSICS (temperature, pressure, compound) {not needed}
    Status: NOT SIMULATED by GTA engine
    Workaround: Fake via time-based traction curve degradation [D4]

[X6] REAL DIFFERENTIAL SIMULATION (open/locked/LSD) [see if doable]
    Status: NOT EXPOSED
    Workaround: Fake with traction bias + brake-based torque vectoring

[X7] CHANGE VEHICLE CLASS AT RUNTIME {not neeeded}
    Status: IMPOSSIBLE (vehicles.meta, not scriptable)
    Impact: Can't remove muscle car class to avoid hardcoded behaviors

[X8] MODIFY CENTER OF MASS RELIABLY {not needed; just use applyforcetotentity}
    Status: UNRELIABLE (SetVehicleHandlingVector doesn't consistently apply)
    Workaround: Restream handling.meta, or use ApplyForceToEntity for
    weight-transfer simulation effects

[X9] TRUE TURBO LAG (delayed boost) {no need}
    Status: PARTIALLY possible
    How: fDriveInertia creates SOME throttle lag, but it's not real spool
    Workaround: Track throttle time → ramp torque multiplier over 0.5-1s

[X10] GEARBOX RATIOS {not needed}
    Status: NOT EXPOSED (no per-gear ratio control)
    Workaround: Modulate torque multiplier per gear to simulate ratio feel
