<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK 合成</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="panel" class="hidden">
        <div class="craft-window">
            <!-- Header -->
            <div class="craft-header">
                <div class="ch-titles">
                    <h2 id="ch-title">合成</h2>
                    <p id="ch-sub" class="ch-sub">工作枱</p>
                </div>
                <button id="btn-close" class="btn-icon" title="關閉">&times;</button>
            </div>

            <!-- Category tabs (auto-hidden when only one category) -->
            <div id="cat-tabs" class="cat-tabs"></div>

            <div class="craft-body">
                <!-- Left: item list -->
                <div id="item-list" class="item-list"></div>

                <!-- Right: detail of selected item -->
                <div id="detail" class="detail detail-empty">
                    <p class="detail-hint">揀一件物品嚟合成</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
